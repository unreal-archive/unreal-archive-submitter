plugins {
	id 'java'
	id 'application'
	id 'maven-publish'
	id 'jacoco'

	alias(libs.plugins.jlink)
	alias(libs.plugins.extra.module.info)
}

group = 'org.unrealarchive'
version = "1.11"
if (System.getenv().containsKey("BUILD_NUMBER")) {
	version += ".${System.getenv("BUILD_NUMBER")}"
} else version += ".DEV"

application {
	mainClass = 'org.unrealarchive.submitter.Main'
	mainModule = 'unreal.archive.submit'
}

jar {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Main-Class': application.mainClass,
		)
	}
}

compileJava {
    options.release = 25
}

jlink {
	mergedModuleName = "unreal.archive.submit.merged"
	options = ['--compress', 'zip-6', '--no-header-files', '--no-man-pages']

	imageName = "${project.name}"
	imageDir = layout.buildDirectory.dir(project.name)

	/**
	 * jboss-logging instantiates every `@MessageLogger` / `@MessageBundle` interface through
	 * `MethodHandles.privateLookupIn`, which requires org.jboss.logging to *read* the module declaring the
	 * interface, on top of that module opening the package (all of ours are open modules already). Those
	 * modules cannot be declared as readable the other way around - undertow.core already requires
	 * org.jboss.logging, and `requires` cycles are illegal - so the edges are added at launch.
	 *
	 * The modules needing an edge are those carrying jboss-logging's generated `*_$logger` / `*_$bundle`
	 * classes; find them with:
	 *   for j in build/jlinkbase/jlinkjars/*.jar; do unzip -l $j | grep -q '_\$\(logger\|bundle\)\.class' \
	 *       && jar --describe-module --file $j | head -1; done
	 */
	launcher {
		jvmArgs = ["-XX:+UseStringDeduplication", "-XX:+UseCompactObjectHeaders",
				   "--add-reads", "org.jboss.logging=" + [
						   'undertow.core',
						   'org.jboss.threads',
						   'org.wildfly.common',
						   'io.smallrye.common.constraint',
						   'io.smallrye.common.expression',
						   'io.smallrye.common.function',
						   'io.smallrye.common.net',
						   'unreal.archive.submit.merged',
				   ].join(',')]
	}

	mergedModule {
		additive = true

		// Only the JDK modules need declaring: these come from the `$JAVA_HOME/jmods` scan, which
		// silently yields nothing on JEP 493 linkable-runtime JDKs (Temurin 24+). Everything else -
		// third-party requires, uses, provides - is scanned from the dependency jars and is unaffected.
		// excludeRequires drops them from the scan first, so they aren't declared twice.
		excludeRequires 'java.desktop', 'java.logging', 'java.management', 'java.security.jgss',
				'java.security.sasl', 'java.sql', 'java.xml', 'jdk.unsupported'
		requires 'java.desktop'
		requires 'java.logging'
		requires 'java.management'
		requires 'java.security.jgss'
		requires 'java.security.sasl'
		requires 'java.sql'
		requires 'java.xml'
		requires 'jdk.unsupported'
	}

	jpackage {
		installerType = project.findProperty('installerType')
	}
}

/**
 * Verifies every module this build *generates* reads all the modules its classes use: the merged module
 * holding the non-modular dependencies, and the module-infos synthesised by `extraJavaModuleInfo`.
 *
 * The jlink plugin infers the merged module's `requires` by scanning `$JAVA_HOME/jmods` for a package to
 * module map, and silently declares nothing it cannot resolve - so JDKs built with JEP 493 linkable
 * runtimes, which ship no `jmods` directory, produce a merged module reading only java.base and an image
 * missing modules entirely. The scan also misses some references jdeps finds. Synthesised module-infos are
 * only as complete as their hand-written `requires` list.
 *
 * Either way the result is an IllegalAccessError the first time the undeclared code path runs, so it is
 * worth failing the build instead. jdeps reports what the classes really need, independently of the build
 * JDK's packaging.
 */
def checkModuleReads = tasks.register('checkModuleReads') {
	group = 'verification'
	description = 'Checks that generated modules read every module their classes use'
	// jlinkjars is only complete after prepareModulesDir: it adds the delegating modules, the
	// remaining modular jars, and rewrites descriptors of jars whose dependencies were merged away
	dependsOn tasks.named('prepareModulesDir')

	def jlinkBase = layout.buildDirectory.dir('jlinkbase')
	def buildFileName = buildFile.name
	def release = JavaVersion.current().majorVersion

	doLast {
		def base = jlinkBase.get().asFile
		def jlinkJars = new File(base, 'jlinkjars')
		def finder = java.lang.module.ModuleFinder.compose(
				java.lang.module.ModuleFinder.of(jlinkJars.toPath()),
				java.lang.module.ModuleFinder.ofSystem())
		def descriptorOf = { File jar ->
			java.lang.module.ModuleFinder.of(jar.toPath()).findAll().first().descriptor()
		}

		// modules readable from the given one: its own requires, plus `requires transitive` chains
		def readableFrom = { java.lang.module.ModuleDescriptor descriptor ->
			Set<String> readable = []
			def queue = new ArrayDeque<String>(descriptor.requires()*.name())
			while (!queue.isEmpty()) {
				def name = queue.poll()
				if (!readable.add(name)) continue
				finder.find(name).ifPresent { ref ->
					ref.descriptor().requires().each { req ->
						if (req.modifiers().contains(
								java.lang.module.ModuleDescriptor.Requires.Modifier.TRANSITIVE)) {
							queue.add(req.name())
						}
					}
				}
			}
			readable
		}

		// the merged module is checked against its classes as they were before module-info was attached,
		// since jdeps reports only declared requires for an already modular jar
		def mergedClasses = new File(base, 'tmpmerged').listFiles()?.find { it.name.endsWith('.jar') }
		def mergedModule = jlinkJars.listFiles()?.find {
			it.name.contains('merged') && it.name.endsWith('.jar')
		}
		if (!mergedClasses || !mergedModule) throw new GradleException(
				"No merged module found under $base - expected tmpmerged/ and jlinkjars/ jars")

		def targets = [[mergedClasses, mergedModule, 'jlink { mergedModule { ... } }']]
		jlinkJars.listFiles()?.findAll { it.name.endsWith('-module.jar') }?.each {
			targets << [it, it, "extraJavaModuleInfo { module('...', '${descriptorOf(it).name()}') { ... } }"]
		}

		logger.info("Auditing generated modules: {}", targets.collect { it[0].name })
		def jdeps = java.util.spi.ToolProvider.findFirst('jdeps')
				.orElseThrow { new GradleException('jdeps is unavailable in the Gradle JVM') }
		def problems = []
		targets.each { classesJar, moduleJar, where ->
			def descriptor = descriptorOf(moduleJar)
			def args = ['-s', '--multi-release', release, '--module-path', jlinkJars.path]
			if (classesJar == moduleJar) args += ['--add-modules', descriptor.name()]
			def report = new StringWriter()
			def errors = new StringWriter()
			if (jdeps.run(new PrintWriter(report), new PrintWriter(errors),
						  (args + classesJar.path) as String[]) != 0) {
				throw new GradleException("jdeps failed on ${classesJar.name}: $errors")
			}

			// "jar -> module" per used module, plus pseudo-entries ("not found") to ignore
			def used = report.toString().readLines()
					.findAll { it.contains(' -> ') }
					.collect { (it =~ / -> (\S+)$/).with { m -> m ? m[0][1] : null } }
					.findAll { it ==~ /(?!java\.base$)[a-z][a-zA-Z0-9.]*/ } as Set

			def missing = (used - readableFrom(descriptor)).sort()
			if (missing) problems << "${descriptor.name()} does not read ${missing.join(', ')}\n" +
					"\tdeclare in $buildFileName, $where:\n" +
					missing.collect { "\t\trequires '$it'" }.join('\n')
		}

		if (problems) throw new GradleException(
				"Generated modules are missing readability edges, which fail at runtime as an " +
				"IllegalAccessError:\n" + problems.join('\n') +
				"\nIn an `additive = true` mergedModule block, also `excludeRequires` those modules, so they " +
				"are not declared twice.")
	}
}

tasks.named('check') { dependsOn checkModuleReads }
tasks.named('jlink') { dependsOn checkModuleReads }

def tarTask = tasks.register('jlinkTar', Tar) {
	dependsOn jlinkZip
	archiveFileName = "${jlink.imageName.get()}.tgz"
	destinationDirectory = layout.buildDirectory
	compression = Compression.GZIP

	into("${jlink.imageName.get()}") {
		from jlink.imageDir
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url = "https://git.pookaroo.au/api/packages/shrimp/maven"
		credentials(HttpHeaderCredentials) {
			name = "Authorization"
			value = "token ${providers.gradleProperty("packagesReadToken").get()}"
		}
		authentication {
			header(HttpHeaderAuthentication)
		}
	}
}

publishing {
	repositories {
		maven {
			name = "ShrimpWorks"
			url = 'https://git.pookaroo.au/api/packages/shrimp/maven'
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "token ${System.env.PACKAGES_TOKEN}"
			}

			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}
	publications {
		maven(MavenPublication) {
			from components.java
			artifact(tarTask) {
				classifier = 'bin'
				extension = 'tgz'
			}
		}
	}
}

artifacts {
	archives(layout.buildDirectory.file("${project.name}-bin.tgz")) {
		type = 'tgz'
		builtBy tarTask
	}
}

dependencies {
	implementation(libs.bundles.unreal.archive)

	implementation(libs.bundles.slf4j)
	implementation(libs.undertow.core)
	implementation(libs.jgit)
	implementation(libs.github.api)

	implementation(libs.jackson.databind)

	testImplementation(libs.junit.jupiter)
	testImplementation(libs.mockito.core)

	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

extraJavaModuleInfo {
	failOnMissingModuleInfo.set(false)

	/**
	 * `requires` of a synthesised module-info are only as complete as this list: anything missing becomes
	 * an IllegalAccessError the first time that code path runs. Audited by `checkModuleReads`; list with
	 * `jdeps -s --module-path build/jlinkbase/jlinkjars --add-modules <module> <the -module.jar>`.
	 */
	module("org.kohsuke:github-api", "org.kohsuke.github.api") {
		requires("java.logging")
		requires("com.fasterxml.jackson.annotation")
		requires("com.fasterxml.jackson.core")
		requires("com.fasterxml.jackson.databind")
		requires("org.apache.commons.lang3")
		requires("org.apache.commons.io")
		exports("org.kohsuke.github")
	}

	module("org.jboss.xnio:xnio-api", "xnio.api") {
		exports("org.xnio")
	}

	module("io.undertow:undertow-core", "undertow.core") {
		requires("xnio.api")
		requires("org.jboss.logging")
		requires("org.wildfly.common")
		requires("java.naming")
		requires("java.security.jgss")
		requires("java.sql")
		requires("jdk.unsupported")

		exports("io.undertow")
		exports("io.undertow.io")
		exports("io.undertow.server")
		exports("io.undertow.server.handlers.form")
		exports("io.undertow.util")
	}
}

test {
	useJUnitPlatform()
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}
