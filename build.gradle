plugins {
	id 'java'
	id 'application'
	id 'maven-publish'
	id 'jacoco'

	alias(libs.plugins.jlink)
	alias(libs.plugins.extra.module.info)
}

group = 'org.unrealarchive'
version = "1.11"
if (System.getenv().containsKey("BUILD_NUMBER")) {
	version += ".${System.getenv("BUILD_NUMBER")}"
} else version += ".DEV"

application {
	mainClass = 'org.unrealarchive.submitter.Main'
	mainModule = 'unreal.archive.submit'
}

jar {
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Main-Class': application.mainClass,
		)
	}
}

compileJava {
    options.release = 25
}

jlink {
	mergedModuleName = "unreal.archive.submit.merged"
	options = ['--compress', 'zip-6', '--no-header-files', '--no-man-pages']

	imageName = "${project.name}"
	imageDir = layout.buildDirectory.dir(project.name)

	launcher {
		jvmArgs = ["-XX:+UseStringDeduplication", "-XX:+UseCompactObjectHeaders"]
	}

	mergedModule {
		additive = true

		// Only the JDK modules need declaring: these come from the `$JAVA_HOME/jmods` scan, which
		// silently yields nothing on JEP 493 linkable-runtime JDKs (Temurin 24+). Everything else -
		// third-party requires, uses, provides - is scanned from the dependency jars and is unaffected.
		// excludeRequires drops them from the scan first, so they aren't declared twice.
		excludeRequires 'java.desktop', 'java.logging', 'java.management', 'java.security.jgss',
				'java.security.sasl', 'java.sql', 'java.xml', 'jdk.unsupported'
		requires 'java.desktop'
		requires 'java.logging'
		requires 'java.management'
		requires 'java.security.jgss'
		requires 'java.security.sasl'
		requires 'java.sql'
		requires 'java.xml'
		requires 'jdk.unsupported'
	}

	jpackage {
		installerType = project.findProperty('installerType')
	}
}

/**
 * Verifies the merged module (holding the non-modular dependencies) declares every module its classes
 * actually use.
 *
 * The plugin infers those `requires` by scanning `$JAVA_HOME/jmods` for a package to module map, and
 * silently declares nothing it cannot resolve - so JDKs built with JEP 493 linkable runtimes, which ship
 * no `jmods` directory, produce a merged module reading only java.base, and an image which is missing
 * modules entirely. The scan also misses some references jdeps finds.
 *
 * jdeps reads the merged classes before their module-info is attached, so it reports what they really
 * need, independently of the build JDK's packaging. Declare anything reported here in `mergedModule`.
 */
def checkMergedModuleInfo = tasks.register('checkMergedModuleInfo') {
	group = 'verification'
	description = 'Checks that the merged module declares every module its classes use'
	dependsOn tasks.named('createMergedModule')

	def jlinkBase = layout.buildDirectory.dir('jlinkbase')
	def buildFileName = buildFile.name
	def release = JavaVersion.current().majorVersion

	doLast {
		def base = jlinkBase.get().asFile
		def mergedClasses = new File(base, 'tmpmerged').listFiles()?.find { it.name.endsWith('.jar') }
		def mergedModule = new File(base, 'jlinkjars').listFiles()?.find {
			it.name.contains('merged') && it.name.endsWith('.jar')
		}
		if (!mergedClasses || !mergedModule) throw new GradleException(
				"No merged module found under $base - expected tmpmerged/ and jlinkjars/ jars")

		def jdeps = java.util.spi.ToolProvider.findFirst('jdeps')
				.orElseThrow { new GradleException('jdeps is unavailable in the Gradle JVM') }
		def report = new StringWriter()
		def errors = new StringWriter()
		if (jdeps.run(new PrintWriter(report), new PrintWriter(errors), '-s', '--multi-release', release,
					  '--module-path', new File(base, 'jlinkjars').path, mergedClasses.path) != 0) {
			throw new GradleException("jdeps failed on ${mergedClasses.name}: $errors")
		}

		// "jar -> module" per used module, plus unresolvable pseudo-entries ("not found") to ignore
		def used = report.toString().readLines()
				.findAll { it.contains(' -> ') }
				.collect { (it =~ / -> (\S+)$/).with { m -> m ? m[0][1] : null } }
				.findAll { it ==~ /(?!java\.base$)[a-z][a-zA-Z0-9.]*/ } as Set

		def declared = java.lang.module.ModuleFinder.of(mergedModule.toPath())
				.findAll().first().descriptor().requires()*.name() as Set

		def missing = (used - declared).sort()
		if (missing) throw new GradleException(
				"${mergedModule.name} uses ${missing.size()} module(s) it does not read: ${missing.join(', ')}\n" +
				"Declare them in the jlink { mergedModule { ... } } block of $buildFileName:\n" +
				missing.collect { "\t\trequires '$it'" }.join('\n') + "\n" +
				"In an `additive = true` block, also exclude them from the scan to avoid declaring them twice:\n" +
				"\t\texcludeRequires ${missing.collect { "'$it'" }.join(', ')}")
	}
}

tasks.named('check') { dependsOn checkMergedModuleInfo }
tasks.named('jlink') { dependsOn checkMergedModuleInfo }

def tarTask = tasks.register('jlinkTar', Tar) {
	dependsOn jlinkZip
	archiveFileName = "${jlink.imageName.get()}.tgz"
	destinationDirectory = layout.buildDirectory
	compression = Compression.GZIP

	into("${jlink.imageName.get()}") {
		from jlink.imageDir
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url = "https://git.pookaroo.au/api/packages/shrimp/maven"
		credentials(HttpHeaderCredentials) {
			name = "Authorization"
			value = "token ${providers.gradleProperty("packagesReadToken").get()}"
		}
		authentication {
			header(HttpHeaderAuthentication)
		}
	}
}

publishing {
	repositories {
		maven {
			name = "ShrimpWorks"
			url = 'https://git.pookaroo.au/api/packages/shrimp/maven'
			credentials(HttpHeaderCredentials) {
				name = "Authorization"
				value = "token ${System.env.PACKAGES_TOKEN}"
			}

			authentication {
				header(HttpHeaderAuthentication)
			}
		}
	}
	publications {
		maven(MavenPublication) {
			from components.java
			artifact(tarTask) {
				classifier = 'bin'
				extension = 'tgz'
			}
		}
	}
}

artifacts {
	archives(layout.buildDirectory.file("${project.name}-bin.tgz")) {
		type = 'tgz'
		builtBy tarTask
	}
}

dependencies {
	implementation(libs.bundles.unreal.archive)

	implementation(libs.bundles.slf4j)
	implementation(libs.undertow.core)
	implementation(libs.jgit)
	implementation(libs.github.api)

	implementation(libs.jackson.databind)

	testImplementation(libs.junit.jupiter)
	testImplementation(libs.mockito.core)

	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

extraJavaModuleInfo {
	failOnMissingModuleInfo.set(false)

	module("org.kohsuke:github-api", "org.kohsuke.github.api") {
		requires("java.logging")
		requires("com.fasterxml.jackson.databind")
		requires("org.apache.commons.lang3")
		requires("org.apache.commons.io")
		exports("org.kohsuke.github")
	}

	module("org.jboss.xnio:xnio-api", "xnio.api") {
		exports("org.xnio")
	}

	module("io.undertow:undertow-core", "undertow.core") {
		requires("xnio.api")
		requires("org.jboss.logging")

		exports("io.undertow")
		exports("io.undertow.io")
		exports("io.undertow.server")
		exports("io.undertow.server.handlers.form")
		exports("io.undertow.util")
	}
}

test {
	useJUnitPlatform()
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}
